<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="lz" x1="44" y1="4" x2="22" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.45" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <g stroke="url(#lz)" stroke-linecap="round" stroke-linejoin="round">
    <!-- bent legs (running gait) -->
    <path d="M35 19 L26.5 15.5 L24 8.5" stroke-width="3.4"/>
    <path d="M38.5 23 L46.5 25 L50 18.5" stroke-width="3.4"/>
    <path d="M30.5 34.5 L22 35 L17.5 41" stroke-width="3.4"/>
    <path d="M33.5 38 L40 43.5 L39.5 51" stroke-width="3.4"/>
    <!-- torso -->
    <path d="M38.5 15 C36 23 33 30 31.5 38" stroke-width="10.5"/>
    <!-- tapering tail -->
    <path d="M31.5 38 C30 43 28 46 25 49" stroke-width="6.5"/>
    <path d="M25 49 C21.5 53 22 58.5 27.5 59.5" stroke-width="4.4"/>
    <path d="M27.5 59.5 C32 60.2 35 57.5 34 54.5" stroke-width="2.6"/>
  </g>
  <g fill="url(#lz)">
    <!-- splayed toes -->
    <circle cx="23.6" cy="7.4" r="2"/><circle cx="50.6" cy="17.4" r="2"/>
    <circle cx="16.8" cy="42" r="2"/><circle cx="39.4" cy="52.2" r="2"/>
    <!-- head: broad gecko head, turned up-right -->
    <ellipse cx="40.4" cy="9.8" rx="5.6" ry="7" transform="rotate(17 40.4 9.8)"/>
    <circle cx="37.2" cy="7" r="2.3"/>
    <circle cx="43.9" cy="9" r="2.3"/>
  </g>
  <!-- eyes + dorsal spots -->
  <circle cx="37" cy="6.6" r="1.25" fill="#fff"/>
  <circle cx="44.1" cy="8.6" r="1.25" fill="#fff"/>
  <circle cx="36.9" cy="6.4" r="0.55" fill="#0a1630"/>
  <circle cx="44.2" cy="8.4" r="0.55" fill="#0a1630"/>
  <circle cx="36.6" cy="22.5" r="1.25" fill="#dbeafe"/>
  <circle cx="34.9" cy="27.8" r="1.25" fill="#dbeafe"/>
  <circle cx="33.4" cy="33" r="1.25" fill="#dbeafe"/>
</svg>
