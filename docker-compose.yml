services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: rapid
      POSTGRES_PASSWORD: rapid_dev
      POSTGRES_DB: rapid
    volumes:
      - rapid_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - rapid_redis:/data

volumes:
  rapid_pg:
  rapid_redis:
