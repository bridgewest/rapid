services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: dukorpay
      POSTGRES_PASSWORD: dukorpay_dev
      POSTGRES_DB: dukorpay
    volumes:
      - dukorpay_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - dukorpay_redis:/data

volumes:
  dukorpay_pg:
  dukorpay_redis:
